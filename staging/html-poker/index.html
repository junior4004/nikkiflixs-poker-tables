<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Premium Texas Hold'em Poker - Play against AI or with friends on LAN">
    <title>Texas Hold'em Poker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Main Menu Overlay -->
    <div id="main-menu" class="overlay active">
        <div class="menu-container glass-panel">
            <h1 class="menu-title">♠ Texas Hold'em ♥</h1>
            <p class="menu-subtitle">Premium Poker Experience</p>

            <div class="menu-options">
                <button id="btn-single-player" class="menu-btn primary">
                    <span class="btn-icon">🤖</span>
                    Play vs AI
                </button>

                <button id="btn-multiplayer" class="menu-btn secondary">
                    <span class="btn-icon">👥</span>
                    LAN Multiplayer
                </button>
            </div>

            <!-- AI Setup Panel -->
            <div id="ai-setup-panel" class="ai-setup-panel hidden">
                <h3>Game Setup</h3>
                <div class="ai-count-control">
                    <label>AI Opponents:</label>
                    <div class="counter-controls">
                        <button id="btn-remove-ai" class="counter-btn">−</button>
                        <span id="ai-count-display">1</span>
                        <button id="btn-add-ai" class="counter-btn">+</button>
                    </div>
                </div>
                <div class="ai-list" id="ai-list">
                    <div class="ai-item">🤖 AI Bot 1 (Tight)</div>
                </div>

                <!-- Game Settings -->
                <div class="game-settings">
                    <div class="settings-row">
                        <label for="starting-chips">Starting Chips:</label>
                        <input type="number" id="starting-chips" value="1000" min="100" max="100000" step="100">
                    </div>
                    <div class="settings-row">
                        <label for="small-blind">Small Blind:</label>
                        <input type="number" id="small-blind" value="10" min="1" max="1000" step="5">
                    </div>
                    <div class="settings-row">
                        <label for="big-blind">Big Blind:</label>
                        <input type="number" id="big-blind" value="20" min="2" max="2000" step="10">
                    </div>
                </div>

                <div class="btn-row">
                    <button id="btn-start-game" class="menu-btn primary">Start Game</button>
                    <button id="btn-back-setup" class="menu-btn text">← Back</button>
                </div>
            </div>

            <div id="multiplayer-panel" class="multiplayer-options hidden">
                <div class="input-group">
                    <label for="player-name">Your Name</label>
                    <input type="text" id="player-name" placeholder="Enter your name" maxlength="12">
                </div>
                <div class="input-group">
                    <label for="server-ip">Server IP</label>
                    <input type="text" id="server-ip" placeholder="localhost:8080">
                </div>
                <div class="btn-row">
                    <button id="btn-host" class="menu-btn small">Host Game</button>
                    <button id="btn-join" class="menu-btn small">Join Game</button>
                </div>
                <button id="btn-back" class="menu-btn text">← Back</button>
            </div>
        </div>
    </div>

    <!-- Game Container -->
    <div id="game-container" class="hidden">
        <!-- Poker Table -->
        <div class="poker-table">
            <div class="table-felt">
                <!-- Community Cards -->
                <div class="community-cards" id="community-cards"></div>

                <!-- Pot Display -->
                <div class="pot-display">
                    <span class="pot-label">POT</span>
                    <span class="pot-amount" id="pot-amount">$0</span>
                </div>

                <!-- Player Seats -->
                <div class="seat seat-0" data-seat="0">
                    <div class="player-info">
                        <div class="player-avatar">👤</div>
                        <div class="player-name">Player 1</div>
                        <div class="player-chips">$1,000</div>
                    </div>
                    <div class="player-cards"></div>
                    <div class="hand-strength hidden"></div>
                    <div class="player-bet"></div>
                    <div class="dealer-button hidden">D</div>
                    <div class="turn-indicator hidden"></div>
                </div>

                <div class="seat seat-1" data-seat="1">
                    <div class="player-info">
                        <div class="player-avatar">🤖</div>
                        <div class="player-name">AI Bot</div>
                        <div class="player-chips">$1,000</div>
                    </div>
                    <div class="player-cards"></div>
                    <div class="hand-strength hidden"></div>
                    <div class="player-bet"></div>
                    <div class="dealer-button hidden">D</div>
                    <div class="turn-indicator hidden"></div>
                </div>

                <!-- Additional seats for multiplayer -->
                <div class="seat seat-2 hidden" data-seat="2">
                    <div class="player-info">
                        <div class="player-avatar">👤</div>
                        <div class="player-name">Player 3</div>
                        <div class="player-chips">$1,000</div>
                    </div>
                    <div class="player-cards"></div>
                    <div class="hand-strength hidden"></div>
                    <div class="player-bet"></div>
                    <div class="dealer-button hidden">D</div>
                    <div class="turn-indicator hidden"></div>
                </div>

                <div class="seat seat-3 hidden" data-seat="3">
                    <div class="player-info">
                        <div class="player-avatar">👤</div>
                        <div class="player-name">Player 4</div>
                        <div class="player-chips">$1,000</div>
                    </div>
                    <div class="player-cards"></div>
                    <div class="hand-strength hidden"></div>
                    <div class="player-bet"></div>
                    <div class="dealer-button hidden">D</div>
                    <div class="turn-indicator hidden"></div>
                </div>

                <div class="seat seat-4 hidden" data-seat="4">
                    <div class="player-info">
                        <div class="player-avatar">👤</div>
                        <div class="player-name">Player 5</div>
                        <div class="player-chips">$1,000</div>
                    </div>
                    <div class="player-cards"></div>
                    <div class="hand-strength hidden"></div>
                    <div class="player-bet"></div>
                    <div class="dealer-button hidden">D</div>
                    <div class="turn-indicator hidden"></div>
                </div>

                <div class="seat seat-5 hidden" data-seat="5">
                    <div class="player-info">
                        <div class="player-avatar">👤</div>
                        <div class="player-name">Player 6</div>
                        <div class="player-chips">$1,000</div>
                    </div>
                    <div class="player-cards"></div>
                    <div class="hand-strength hidden"></div>
                    <div class="player-bet"></div>
                    <div class="dealer-button hidden">D</div>
                    <div class="turn-indicator hidden"></div>
                </div>
            </div>
        </div>

        <!-- Game Info Panel -->
        <div class="game-info glass-panel">
            <div class="blinds-info">
                <span id="blinds-display">Blinds: $10 / $20</span>
            </div>
            <div class="hand-info">
                <span id="hand-display">Hand #0</span>
            </div>
            <div class="phase-info">
                <span id="phase-display">Waiting...</span>
            </div>
        </div>

        <!-- Action Panel -->
        <div class="action-panel glass-panel" id="action-panel">
            <div class="action-info">
                <span id="call-amount">To call: $0</span>
            </div>

            <div class="raise-slider-container">
                <label for="raise-slider">Raise Amount</label>
                <input type="range" id="raise-slider" min="0" max="1000" value="40">
                <span id="raise-amount-display">$40</span>
            </div>

            <div class="action-buttons">
                <button id="btn-fold" class="action-btn fold">Fold</button>
                <button id="btn-check" class="action-btn check">Check</button>
                <button id="btn-call" class="action-btn call">Call</button>
                <button id="btn-raise" class="action-btn raise">Raise</button>
                <button id="btn-all-in" class="action-btn all-in">All-In</button>
            </div>
        </div>

        <!-- Winner Announcement -->
        <div class="winner-overlay hidden" id="winner-overlay">
            <div class="winner-panel glass-panel">
                <h2 id="winner-text">Player Wins!</h2>
                <p id="winner-hand">Royal Flush</p>
                <p id="winner-pot">Won $100</p>
                <button id="btn-next-hand" class="menu-btn primary">Next Hand</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
